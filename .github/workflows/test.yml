name: Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run. Push runs key on their own
# run_id, so no push run is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The gemspec floor (3.2) through the current stable series.
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
